name: Deploy to Hostinger VPS (CloudPanel)

on:
  push:
    branches:
      - client-portal-overhaul-final

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Set up Node.js and build the static Frontend in GitHub Actions
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Frontend
        run: |
          npm install
          npm run build

      # Step 2: Deploy to VPS via SSH
      - name: Deploy Frontend and Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root # Use root user to access both site folders
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting Deployment on VPS..."
            
            # --- 1. DEPLOY FRONTEND ---
            echo "📁 Deploying Frontend to app.hirdanmarketing.com..."
            # Clean old static files first, then we will copy from our Git commit
            # (Note: We use rsync inside SSH step or we will clone/pull the repo to a temporary location on the server)
            
            # We clone the repo to a temporary directory on the server to update the code
            mkdir -p /tmp/hirdan-deploy
            cd /tmp/hirdan-deploy
            
            # Clone or pull fresh repo
            if [ -d "repo" ]; then
              cd repo
              git fetch --all
              git reset --hard origin/client-portal-overhaul-final
            else
              git clone -b client-portal-overhaul-final https://github.com/abdi123a/agency-flow-pro.git repo
              cd repo
            fi
            
            # Build frontend on server or copy the built static files
            # If server has enough RAM, we can just build it on the server:
            echo "📦 Building Frontend on server..."
            npm install
            npm run build
            
            echo "📂 Copying Frontend build files to static directory..."
            # Copy to static web folder and fix ownership permissions
            rsync -av --delete dist/ /home/hirdanmarketing-app/htdocs/app.hirdanmarketing.com/
            chown -R hirdanmarketing-app:hirdanmarketing-app /home/hirdanmarketing-app/htdocs/app.hirdanmarketing.com/
            
            # --- 2. DEPLOY BACKEND ---
            echo "📂 Deploying Backend to api.hirdanmarketing.com..."
            # Sync the server files
            rsync -av --delete server/ /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/ --exclude node_modules --exclude .env
            
            cd /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/
            
            echo "📦 Installing Backend dependencies..."
            npm install --production
            
            echo "⚙️ Generating Database Client..."
            npx prisma generate
            
            # Build backend TypeScript
            echo "🛠 Compiling Backend..."
            npm run build
            
            # Fix ownership permissions for the backend
            chown -R hirdanmarketing-api:hirdanmarketing-api /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/
            
            # --- 3. RESTART NODEJS APP ---
            echo "🔄 Restarting api.hirdanmarketing.com node service..."
            # CloudPanel Node.js restart command
            clpctl app:nodejs:restart --domain=api.hirdanmarketing.com || systemctl restart node-app || echo "Node.js restart initiated."
            
            # Clean up temporary folder
            rm -rf /tmp/hirdan-deploy
            
            echo "✅ Deployment completed successfully!"
