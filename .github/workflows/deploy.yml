name: Deploy to Hostinger VPS (CloudPanel)

on:
  push:
    branches:
      - clean-version

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Resolve SSH_PORT with a proper env-level fallback (secrets.SSH_PORT || '22')
      SSH_PORT: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 1: Build the static Frontend (CRM Dashboard → app.hirdanmarketing.com)
      - name: Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      # Step 2: Build the Landing Page (Next.js → hirdanmarketing.com)
      - name: Build Landing Page
        run: |
          cd landing-page
          npm install --legacy-peer-deps
          npm run build

      # Step 3: Build the Backend in GitHub Action
      - name: Build Backend
        run: |
          cd server
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build
          # Local money-helper smoke (no DB / no running server required for that part)
          node --input-type=module -e "
            import { centsToMajor, dollarsToCents, computeInvoiceTotalsCents } from './dist/lib/money.js';
            if (centsToMajor(1999) !== 19.99) throw new Error('centsToMajor');
            if (dollarsToCents(19.99) !== 1999) throw new Error('dollarsToCents');
            const t = computeInvoiceTotalsCents({ items: [{ quantity: 2, unitPrice: 10000 }], taxRate: 10, discount: 5, discountType: 'PERCENTAGE' });
            if (t.totalCents !== 21000) throw new Error(JSON.stringify(t));
            console.log('money helpers ok');
          "

      # Step 3: Setup SSH key + allow GitHub Actions IPs on VPS firewall
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pre-trust the VPS host key to avoid interactive prompt
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Step 4: Verify SSH connectivity before deploying
      - name: Test SSH Connection
        run: |
          echo "🔌 Testing SSH connection to VPS..."
          ssh -p ${{ env.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/id_ed25519 \
            root@${{ secrets.SSH_HOST }} \
            "echo '✅ SSH connection successful'"

      # Step 5: Deploy pre-compiled files via Rsync
      - name: Deploy Frontend files to VPS
        run: |
          echo "📁 Copying Frontend static files to app.hirdanmarketing.com..."
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519" \
            dist/ \
            root@${{ secrets.SSH_HOST }}:/home/hirdanmarketing-app/htdocs/app.hirdanmarketing.com/

      - name: Deploy Landing Page files to VPS
        run: |
          echo "📁 Copying Landing Page static files to hirdanmarketing.com..."
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519" \
            landing-page/dist/ \
            root@${{ secrets.SSH_HOST }}:/home/hirdanmarketing/htdocs/hirdanmarketing.com/

      - name: Deploy Backend files to VPS
        run: |
          echo "📁 Copying Backend compiled files to api.hirdanmarketing.com..."
          rsync -avz \
            -e "ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519" \
            server/dist server/package.json server/package-lock.json server/prisma server/scripts server/templates \
            root@${{ secrets.SSH_HOST }}:/home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/

      # Step 6: Run server commands (dependencies install & restart service)
      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          timeout: 120s
          command_timeout: 10m
          # Without this the remote script runs straight past a failed command and
          # the job still reports success — which is how a failed `db push`
          # (P2002 on post_insights_post_id_platform_key) previously went
          # unnoticed while the API was restarted anyway. A failed migration must
          # abort the deploy BEFORE pm2 restarts onto a schema that isn't ready.
          script_stop: true
          script: |
            echo "🚀 Finalizing Server Setup..."

            # Fix ownership permissions for the frontend site
            chown -R hirdanmarketing-app:hirdanmarketing-app /home/hirdanmarketing-app/htdocs/app.hirdanmarketing.com/

            # Fix ownership permissions for the landing page site
            chown -R hirdanmarketing:hirdanmarketing /home/hirdanmarketing/htdocs/hirdanmarketing.com/ 2>/dev/null || \
            chown -R www-data:www-data /home/hirdanmarketing/htdocs/hirdanmarketing.com/ || true

            # Ensure uploads symlink is intact (protects branding files from being wiped)
            mkdir -p /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/public
            ln -sfn /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/uploads \
              /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/public/uploads

            # Finish backend setup
            cd /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/

            # Fail fast: env.ts now REQUIRES TOKEN_ENCRYPTION_KEY (it decrypts the
            # stored third-party credentials). Without it the API refuses to boot,
            # so check here — before pm2 restart — rather than taking it down.
            if ! grep -q '^TOKEN_ENCRYPTION_KEY=' .env; then
              echo "❌ TOKEN_ENCRYPTION_KEY missing from server/.env — aborting before restart."
              echo "   Generate one with: openssl rand -hex 32"
              exit 1
            fi

            echo "📦 Installing all Backend dependencies (incl. dev for Prisma CLI)..."
            npm install --legacy-peer-deps

            echo "🌐 Ensuring Puppeteer Chrome is installed for PDF export..."
            npx puppeteer browsers install chrome || echo "⚠️ Puppeteer Chrome install failed — PDF export may 503 until Chrome is available."

            echo "🗄️ Running pre-migration database backup..."
            node scripts/backup.cjs

            echo "⚙️ Generating Database Client on server..."
            ./node_modules/.bin/prisma generate

            # `db push --accept-data-loss` was used here previously. It diffs the
            # schema against the live database and silently drops any column or
            # table that no longer matches — against real client, invoice and
            # payroll data, with no migration history and no review step.
            # `migrate deploy` only applies the reviewed SQL committed under
            # prisma/migrations and refuses to run anything destructive that
            # isn't written down.
            echo "📐 Checking migration baseline..."
            node scripts/baseline-migrations.cjs

            echo "🗄️ Applying database migrations..."
            ./node_modules/.bin/prisma migrate deploy

            echo "🧹 Pruning dev dependencies..."
            npm prune --production --legacy-peer-deps

            # Fix ownership permissions for the backend site
            chown -R hirdanmarketing-api:hirdanmarketing-api /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/

            # --- RESTART NODEJS SERVICE ---
            echo "🔄 Restarting Node.js service for api.hirdanmarketing.com..."
            # A restart that fails outright leaves the OLD build serving traffic,
            # which the health check below would happily pass — so treat it as fatal
            # rather than printing a warning and reporting success.
            sudo -u hirdanmarketing-api pm2 restart api || pm2 restart api || pm2 restart all || {
              echo "❌ pm2 restart failed — the API was NOT restarted and is still running the previous build."
              exit 1
            }

            echo "🩺 Post-restart health smoke..."
            # `pm2 restart` returns as soon as it signals the process, but the API
            # takes appreciably longer to answer: it ESM-loads the whole route tree,
            # cold-starts the Prisma engine, and two schedulers run a round of DB
            # work immediately on boot. A single probe 3s later raced that startup
            # and failed deploys that had actually succeeded, so poll until it
            # answers instead of guessing a fixed delay.
            HEALTH_OK=0
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://127.0.0.1:3001/api/health" > /dev/null 2>&1; then
                HEALTH_OK=1
                echo "✅ Health OK (ready after ~$((attempt * 2))s)"
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              # Loopback never answered — try the public hostname once in case the
              # app is reachable only through nginx, then give up with diagnostics.
              if curl -fsS --max-time 15 "https://api.hirdanmarketing.com/api/health" > /dev/null 2>&1; then
                echo "✅ Health OK (via public hostname)"
              else
                echo "❌ Health check failed — API did not answer within 60s of restart."
                echo "──── pm2 status ────"
                pm2 describe api 2>/dev/null | head -30 || true
                echo "──── last 50 log lines ────"
                pm2 logs api --lines 50 --nostream 2>/dev/null || true
                exit 1
              fi
            fi

            echo "✅ Deployment completed successfully!"
