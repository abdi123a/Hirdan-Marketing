name: Deploy to Hostinger VPS (CloudPanel)

on:
  push:
    branches:
      - clean-version

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Resolve SSH_PORT with a proper env-level fallback (secrets.SSH_PORT || '22')
      SSH_PORT: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 1: Build the static Frontend (CRM Dashboard → app.hirdanmarketing.com)
      - name: Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      # Step 2: Build the Landing Page (Next.js → hirdanmarketing.com)
      - name: Build Landing Page
        run: |
          cd landing-page
          npm install --legacy-peer-deps
          npm run build

      # Step 3: Build the Backend in GitHub Action
      - name: Build Backend
        run: |
          cd server
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      # Step 3: Setup SSH key + allow GitHub Actions IPs on VPS firewall
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pre-trust the VPS host key to avoid interactive prompt
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Step 4: Verify SSH connectivity before deploying
      - name: Test SSH Connection
        run: |
          echo "🔌 Testing SSH connection to VPS..."
          ssh -p ${{ env.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            root@${{ secrets.SSH_HOST }} \
            "echo '✅ SSH connection successful'"

      # Step 5: Deploy pre-compiled files via Rsync
      - name: Deploy Frontend files to VPS
        run: |
          echo "📁 Copying Frontend static files to app.hirdanmarketing.com..."
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519" \
            dist/ \
            root@${{ secrets.SSH_HOST }}:/home/hirdanmarketing-app/htdocs/app.hirdanmarketing.com/

      - name: Deploy Landing Page files to VPS
        run: |
          echo "📁 Copying Landing Page static files to hirdanmarketing.com..."
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519" \
            landing-page/dist/ \
            root@${{ secrets.SSH_HOST }}:/home/hirdanmarketing/htdocs/hirdanmarketing.com/

      - name: Deploy Backend files to VPS
        run: |
          echo "📁 Copying Backend compiled files to api.hirdanmarketing.com..."
          rsync -avz \
            -e "ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519" \
            server/dist server/package.json server/package-lock.json server/prisma server/scripts \
            root@${{ secrets.SSH_HOST }}:/home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/

      # Step 6: Run server commands (dependencies install & restart service)
      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          timeout: 120s
          command_timeout: 10m
          script: |
            echo "🚀 Finalizing Server Setup..."

            # Fix ownership permissions for the frontend site
            chown -R hirdanmarketing-app:hirdanmarketing-app /home/hirdanmarketing-app/htdocs/app.hirdanmarketing.com/

            # Fix ownership permissions for the landing page site
            chown -R hirdanmarketing:hirdanmarketing /home/hirdanmarketing/htdocs/hirdanmarketing.com/ 2>/dev/null || \
            chown -R www-data:www-data /home/hirdanmarketing/htdocs/hirdanmarketing.com/ || true

            # Ensure uploads symlink is intact (protects branding files from being wiped)
            mkdir -p /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/public
            ln -sfn /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/uploads \
              /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/public/uploads

            # Finish backend setup
            cd /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/

            echo "📦 Installing all Backend dependencies (incl. dev for Prisma CLI)..."
            npm install --legacy-peer-deps

            echo "🗄️ Running pre-migration database backup..."
            node scripts/backup.cjs

            echo "⚙️ Generating Database Client on server..."
            ./node_modules/.bin/prisma generate

            echo "🗄️ Pushing database schema..."
            ./node_modules/.bin/prisma db push --accept-data-loss

            echo "🧹 Pruning dev dependencies..."
            npm prune --production --legacy-peer-deps

            # Fix ownership permissions for the backend site
            chown -R hirdanmarketing-api:hirdanmarketing-api /home/hirdanmarketing-api/htdocs/api.hirdanmarketing.com/

            # --- RESTART NODEJS SERVICE ---
            echo "🔄 Restarting Node.js service for api.hirdanmarketing.com..."
            sudo -u hirdanmarketing-api pm2 restart api || pm2 restart api || pm2 restart all || echo "Restart command failed, manual intervention needed."

            echo "✅ Deployment completed successfully!"
